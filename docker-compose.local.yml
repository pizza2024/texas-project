# Local development override - uses HTTP only (no SSL)
# This file should be used with: docker compose -f docker-compose.yml -f docker-compose.local.yml up

services:
  nginx:
    environment:
      DOMAIN: localhost
      SSL_CERT_FILE: /etc/nginx/certs/localhost.crt
      SSL_CERT_KEY: /etc/nginx/certs/localhost.key
    command: >
      /bin/sh -c "envsubst '$${DOMAIN} $${SSL_CERT_FILE} $${SSL_CERT_KEY}' < /etc/nginx/templates/dev.conf.template > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    volumes:
      - ./docker/nginx/conf.d/dev.conf:/etc/nginx/templates/dev.conf.template:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
