services:
  postgres:
    image: postgres:16-alpine
    container_name: texas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-texas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-texas_password}
      POSTGRES_DB: ${DB_NAME:-texas_staging}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-texas} -d ${DB_NAME:-texas_staging}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - texas-network

  redis:
    image: redis:7-alpine
    container_name: texas-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - texas-network

  nginx:
    image: nginx:alpine
    container_name: texas-nginx
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-example.com}
      SSL_CERT_FILE: ${SSL_CERT_FILE:-/etc/nginx/certs/${DOMAIN}.crt}
      SSL_CERT_KEY: ${SSL_CERT_KEY:-/etc/nginx/certs/${DOMAIN}.key}
    command: >
      /bin/sh -c "envsubst '$${DOMAIN} $${SSL_CERT_FILE} $${SSL_CERT_KEY}' < /etc/nginx/templates/prod.conf.template > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx/conf.d/prod.conf:/etc/nginx/templates/prod.conf.template:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - texas-network

volumes:
  postgres_data:
  redis_data:

networks:
  texas-network:
    driver: bridge
